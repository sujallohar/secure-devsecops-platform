apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: ecommerce
data:
  ORDER_SERVICE_PORT: "3003"
  NODE_ENV: "production"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  ORDERS_DB_NAME: "ordersdb"
  ORDERS_DB_USER: "order_svc"
  PRODUCT_SERVICE_URL: "http://product-service:3002"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: ecommerce
type: Opaque
stringData:
  ORDERS_DB_PASSWORD: "test_orders_password_12345"
  JWT_SECRET: "super-secret-ephemeral-ci-test-signing-key-32chars"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  ports:
    - port: 3003
      targetPort: 3003
      name: http
    - port: 9093
      targetPort: 9093
      name: metrics
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: order-service:latest@sha256:484b33f062339157cf91c559d170772a964b8dc06ed23a8ebed353c1da091f7e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
              name: http
            - containerPort: 9093
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3003
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
