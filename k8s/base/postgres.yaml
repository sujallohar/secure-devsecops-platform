apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ecommerce
data:
  01-init.sh: |
    #!/bin/bash
    set -euo pipefail

    run_sql() {
      local db="$1"
      shift
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$db" "$@"
    }

    echo "=== Creating databases ==="
    run_sql "$POSTGRES_DB" <<-EOSQL
      CREATE DATABASE usersdb;
      CREATE DATABASE productsdb;
      CREATE DATABASE ordersdb;
    EOSQL

    echo "=== Creating roles with least-privilege grants ==="
    run_sql "$POSTGRES_DB" <<-EOSQL
      REVOKE CONNECT ON DATABASE usersdb FROM PUBLIC;
      REVOKE CONNECT ON DATABASE productsdb FROM PUBLIC;
      REVOKE CONNECT ON DATABASE ordersdb FROM PUBLIC;

      CREATE ROLE user_svc WITH LOGIN PASSWORD '${USERS_DB_PASSWORD}';
      CREATE ROLE product_svc WITH LOGIN PASSWORD '${PRODUCTS_DB_PASSWORD}';
      CREATE ROLE order_svc WITH LOGIN PASSWORD '${ORDERS_DB_PASSWORD}';

      GRANT CONNECT ON DATABASE usersdb TO user_svc;
      GRANT CONNECT ON DATABASE productsdb TO product_svc;
      GRANT CONNECT ON DATABASE ordersdb TO order_svc;
    EOSQL

    echo "=== Creating usersdb schema ==="
    run_sql "usersdb" <<-EOSQL
      GRANT USAGE ON SCHEMA public TO user_svc;
      GRANT CREATE ON SCHEMA public TO user_svc;

      CREATE TABLE IF NOT EXISTS users (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email       VARCHAR(255) UNIQUE NOT NULL,
        password    VARCHAR(255) NOT NULL,
        role        VARCHAR(50) NOT NULL DEFAULT 'customer',
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
      GRANT SELECT, INSERT, UPDATE, DELETE ON users TO user_svc;
      GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO user_svc;
    EOSQL

    echo "=== Creating productsdb schema ==="
    run_sql "productsdb" <<-EOSQL
      GRANT USAGE ON SCHEMA public TO product_svc;
      GRANT CREATE ON SCHEMA public TO product_svc;

      CREATE TABLE IF NOT EXISTS products (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name        VARCHAR(255) NOT NULL,
        description TEXT,
        price       NUMERIC(10, 2) NOT NULL,
        stock       INT NOT NULL DEFAULT 0,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      GRANT SELECT, INSERT, UPDATE, DELETE ON products TO product_svc;
      GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO product_svc;
    EOSQL

    echo "=== Creating ordersdb schema ==="
    run_sql "ordersdb" <<-EOSQL
      GRANT USAGE ON SCHEMA public TO order_svc;
      GRANT CREATE ON SCHEMA public TO order_svc;

      CREATE TABLE IF NOT EXISTS orders (
        id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id      UUID NOT NULL,
        product_id   UUID NOT NULL,
        quantity     INT NOT NULL DEFAULT 1,
        total_price  NUMERIC(10, 2) NOT NULL,
        status       VARCHAR(50) NOT NULL DEFAULT 'pending',
        created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE INDEX IF NOT EXISTS idx_orders_user_id ON orders(user_id);
      GRANT SELECT, INSERT, UPDATE, DELETE ON orders TO order_svc;
      GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO order_svc;
    EOSQL

    echo "=== Database initialization complete ==="
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "test_admin"
  POSTGRES_PASSWORD: "test_admin_password_12345"
  USERS_DB_PASSWORD: "test_users_password_12345"
  PRODUCTS_DB_PASSWORD: "test_products_password_12345"
  ORDERS_DB_PASSWORD: "test_orders_password_12345"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      name: postgres
      targetPort: 5432
  clusterIP: None
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U test_admin -d postgres -h 127.0.0.1
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U test_admin -d postgres -h 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/01-init.sh
              subPath: 01-init.sh
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
            defaultMode: 0755
        - name: pg-run
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
