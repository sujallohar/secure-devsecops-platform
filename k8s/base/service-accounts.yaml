# ──────────────────────────────────────────────────────────────
# k8s/base/service-accounts.yaml — Dedicated Workload ServiceAccounts
# Security controls:
#   - Dedicated ServiceAccount per microservice workload
#   - automountServiceAccountToken: false prevents automatic API token injection
#   - Principle of Least Privilege: Zero RBAC Roles/RoleBindings assigned
#     because these workloads require no access to the Kubernetes API server.
# ──────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: ecommerce
  labels:
    app: api-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: ecommerce
  labels:
    app: user-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: ecommerce
  labels:
    app: product-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: ecommerce
  labels:
    app: order-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: ecommerce
  labels:
    app: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: ecommerce
  labels:
    app: postgres
automountServiceAccountToken: false
