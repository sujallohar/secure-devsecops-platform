# ──────────────────────────────────────────────────────────────
# k8s/security/networkpolicies/allow-ingress-to-frontend.yaml
#
# Threat Mitigated:
#   - Direct Frontend Probing & Edge Bypass: Enforces that the
#     unprivileged frontend web server is accessible solely via the
#     Ingress Nginx reverse proxy, preventing direct lateral connections
#     from unauthorized pods or namespaces.
# ──────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
