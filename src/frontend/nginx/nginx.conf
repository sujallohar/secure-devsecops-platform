# ──────────────────────────────────────────────────────────────
# src/frontend/nginx/nginx.conf — Hardened Nginx Configuration
# Purpose: Serve Vite production static build with defense-in-depth
#          HTTP headers and unprivileged non-root execution.
# Security controls:
#   - server_tokens off: Hide nginx version from reconnaissance
#   - Content-Security-Policy (CSP): Restrict script, style, and connect sources
#   - X-Frame-Options: DENY (Clickjacking protection)
#   - X-Content-Type-Options: nosniff (MIME sniffing prevention)
#   - Referrer-Policy: strict-origin-when-cross-origin
#   - Permissions-Policy: Disable unused device features
#   - Non-root user: Listens on port 8080 (unprivileged port)
# ──────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Security: Hide nginx version banner
  server_tokens off;

  # Logging format with correlation ID awareness
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip compression for static performance
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hardened Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:3000 http://localhost:8080; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Healthcheck endpoint for container orchestrators
    location /health {
      access_log off;
      default_type text/plain;
      return 200 "healthy\n";
    }

    # Proxy API calls to api-gateway if accessed via frontend port
    location /api/ {
      proxy_pass http://api-gateway:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # SPA routing: fallback all non-file routes to index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
