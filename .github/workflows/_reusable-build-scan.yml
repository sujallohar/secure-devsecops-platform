# ──────────────────────────────────────────────────────────────
# .github/workflows/_reusable-build-scan.yml — Reusable Build & Scan
# Purpose: Builds the container image, runs Trivy for vulnerability,
#          secret, and misconfig scanning, and validates the output
#          against the Phase 9 Security Gate Engine.
#          Then generates SBOMs, pushes to ghcr.io, and signs.
# ──────────────────────────────────────────────────────────────
name: Build and Scan

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string
      service-name:
        required: true
        type: string

jobs:
  build-and-scan:
    name: Build & Scan (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.1.0

      - name: Convert repository name to lowercase
        id: repo_case
        run: |
          REPO="${{ github.repository }}"
          echo "repo_lower=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Extract Version and SHA
        id: vars
        run: |
          VERSION=$(jq -r .version ${{ inputs.service-path }}/package.json || echo "1.0.0")
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_name=ghcr.io/${{ steps.repo_case.outputs.repo_lower }}-${{ inputs.service-name }}" >> $GITHUB_OUTPUT

      - name: Build image (No push yet)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ inputs.service-path }}
          file: ${{ inputs.service-path }}/Dockerfile
          push: false
          load: true # Load into local docker daemon for Trivy scanning
          tags: ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}
          provenance: false # We will attest it separately

      - name: Run Trivy (JSON output for gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}'
          format: 'json'
          output: 'trivy-results.json'
          scanners: 'vuln,secret,misconfig'

      - name: Run Trivy (SARIF output for Code Scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln,secret,misconfig'

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ inputs.service-name }}

      - name: Run Trivy (Table format for humans)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}'
          format: 'table'
          scanners: 'vuln,secret,misconfig'
          exit-code: '0'

      - name: Set up Node.js 22 (For Security Gate)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies for Gate
        run: npm ci

      - name: Run Security Gate Engine
        run: node scripts/security-gate.js trivy-results.json
        env:
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY

      - name: Upload Trivy JSON as Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: trivy-json-${{ inputs.service-name }}
          path: trivy-results.json
          if-no-files-found: ignore

      # --- PHASE 11: Supply Chain Artifacts (SBOM, Cosign, Provenance) ---
      
      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: '${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}'
          format: spdx-json
          output-file: sbom-${{ inputs.service-name }}.spdx.json
          upload-artifact: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: '${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}'
          format: cyclonedx-json
          output-file: sbom-${{ inputs.service-name }}.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOMs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-${{ inputs.service-name }}
          path: |
            sbom-${{ inputs.service-name }}.spdx.json
            sbom-${{ inputs.service-name }}.cyclonedx.json

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ inputs.service-path }}
          file: ${{ inputs.service-path }}/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}
          provenance: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign image with Cosign
        run: cosign sign --yes ${{ steps.vars.outputs.image_name }}@${{ steps.push.outputs.digest }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.vars.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify Cosign signature
        run: >
          cosign verify 
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" 
          --certificate-identity-regexp "https://github.com/.+" 
          ${{ steps.vars.outputs.image_name }}@${{ steps.push.outputs.digest }}
