# ──────────────────────────────────────────────────────────────
# .github/workflows/dast.yml — Dynamic Application Security Testing
# Purpose: Runtime HTTP surface scanning against ephemeral microservices
#          test stack using OWASP ZAP baseline scan.
#
# Pipeline Gate: Stage 3 (DAST gate) — verifies runtime configuration,
#                security headers, and unexpected exposure before deployment.
#
# Security controls:
#   - Workflow-level least-privilege permissions: contents: read
#   - Pinned third-party action SHAs with version comments
#   - Ephemeral local-to-runner test stack (zero cloud cost)
#   - Fail on any FAIL-level alert; WARN is reported but non-blocking (-I)
#   - HTML and JSON ZAP scan reports archived as artifacts
#   - Ephemeral compose stack teardown on always()
# ──────────────────────────────────────────────────────────────

name: DAST (OWASP ZAP)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dast-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start ephemeral test stack
        run: |
          echo "Starting ephemeral microservices stack..."
          docker compose -f docker/docker-compose.test.yml up -d --build

      - name: Wait for API Gateway readiness
        run: |
          echo "Waiting for API Gateway to become healthy..."
          READY=false
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API Gateway is healthy and responding with HTTP 200 (attempt $i)"
              READY=true
              break
            fi
            echo "Waiting for gateway... (attempt $i/30, status: $STATUS)"
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "API Gateway failed to become ready within timeout"
            docker compose -f docker/docker-compose.test.yml logs api-gateway
            exit 1
          fi

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          allow_issue_writing: false
          artifact_name: 'zap_scan'
          cmd_options: '-I'
          fail_action: true

      - name: Upload ZAP Scan Reports
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: zap-dast-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: ignore

      - name: Tear down ephemeral test stack
        if: always()
        run: |
          echo "Tearing down ephemeral microservices stack..."
          docker compose -f docker/docker-compose.test.yml down -v
