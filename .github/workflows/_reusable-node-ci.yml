# ──────────────────────────────────────────────────────────────
# .github/workflows/_reusable-node-ci.yml
# Purpose: Reusable workflow for building, linting, and testing
#          Node.js microservices and frontend components.
# Security controls:
#   - Workflow-level least-privilege permissions: contents: read
#   - Third-party actions pinned to full immutable commit SHAs
#   - Dependency integrity via npm ci and package-lock caching
# ──────────────────────────────────────────────────────────────

name: Reusable Node CI

on:
  workflow_call:
    inputs:
      service-path:
        description: 'Relative path to service directory'
        required: true
        type: string
      coverage-threshold:
        description: 'Minimum required test coverage percentage'
        required: false
        type: number
        default: 70
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ inputs.service-path }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.service-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service-path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint source code
        run: npm run lint

      - name: Execute test suite
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-${{ inputs.service-path }}
          path: ${{ inputs.service-path }}/coverage/
          if-no-files-found: ignore
