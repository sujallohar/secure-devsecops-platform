# ──────────────────────────────────────────────────────────────
# .github/workflows/deploy-showcase.yml
#
# Automated deployment of the Interactive Showcase Web Dashboard
# to GitHub Pages (100% free hosting).
# ──────────────────────────────────────────────────────────────

name: Deploy Showcase to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/phase-02-microservices
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Showcase artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'showcase'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
