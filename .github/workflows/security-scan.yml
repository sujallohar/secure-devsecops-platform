# ──────────────────────────────────────────────────────────────
# .github/workflows/security-scan.yml — Security Scanning Pipeline
# Purpose: Run static application security testing (SAST) using
#          Semgrep, and secret detection using Gitleaks across
#          the entire git commit history.
#
# Security controls:
#   - Workflow-level least-privilege permissions: contents: read
#   - Per-job widening: security-events: write for SARIF upload
#   - Third-party actions pinned to full immutable commit SHAs
#   - Semgrep fails on ERROR severity only; WARNING/INFO are reported
#   - Gitleaks fails on ANY detected secret across full history (depth: 0)
#
# What Semgrep does:
#   Semgrep is a pattern-matching SAST tool. It scans source code
#   for known insecure patterns (SQL injection, command injection,
#   hardcoded secrets, etc.) by matching AST patterns you define
#   in rules. It runs fast because it does NOT build the project.
#
# What Semgrep CAN detect:
#   - Code patterns that match known-bad templates (e.g., template
#     literal SQL, exec with variables, JWT verify without alg)
#   - Hardcoded secrets that match regex patterns
#   - Common OWASP Top 10 vulnerabilities in source code
#   - Dataflow within a single function (taint tracking)
#
# What Semgrep CANNOT detect:
#   - Runtime vulnerabilities (requires dynamic analysis / DAST)
#   - Logic errors and business logic flaws
#   - Vulnerabilities in third-party dependencies (that's SCA)
#   - Complex cross-file, cross-module data flow (limited inter-
#     procedural analysis compared to commercial tools)
#   - Configuration issues in deployed infrastructure
#   - Timing attacks, race conditions, or concurrency bugs
#   - Obfuscated code or patterns it has no rule for
# ──────────────────────────────────────────────────────────────

name: Security Scan

on:
  schedule:
    # Nightly audit scan at 02:00 UTC to catch newly-published CVEs against unchanged code
    - cron: '0 2 * * *'
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'scratch/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Semgrep SAST ─────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write   # Required to upload SARIF to Code Scanning
      actions: read            # Required by upload-sarif to read workflow run metadata

    container:
      # Use the official Semgrep Docker image (semgrep/semgrep-action
      # is deprecated since April 2024). This image contains the
      # semgrep CLI and is maintained by the Semgrep team.
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Run Semgrep with community + custom rulesets ──────────
      # Rulesets used:
      #   p/javascript   — JavaScript security patterns
      #   p/nodejs        — Node.js-specific patterns (Express, etc.)
      #   p/owasp-top-ten — OWASP Top 10 vulnerability patterns
      #   p/secrets       — Hardcoded secrets detection
      #   + our custom rules in security/semgrep/custom-rules.yaml
      #
      # --sarif: Output in SARIF format for GitHub Code Scanning
      # --error: Exit with code 1 only on ERROR severity findings
      #          (WARNING and INFO findings are reported but don't
      #          fail the build)
      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=security/semgrep/custom-rules.yaml \
            --sarif \
            --output=semgrep-results.sarif \
            --severity=ERROR \
            --error \
            src/

      # ── Upload SARIF to GitHub Code Scanning ──────────────────
      # This makes findings visible in the repository's Security
      # tab under "Code Scanning". SARIF (Static Analysis Results
      # Interchange Format) is the standard format for SAST results.
      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true # Gracefully handle repositories without paid GitHub Advanced Security licenses
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # ── Upload SARIF as build artifact for evidence ───────────
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          if-no-files-found: ignore

  # ── Gitleaks Secret Detection ────────────────────────────────
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write   # Required to upload SARIF to Code Scanning
      actions: read            # Required by upload-sarif to read workflow run metadata

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0       # Full history is required to detect leaked secrets in past commits

      # ── Run Gitleaks scan on full git history ─────────────────
      # Scans the entire git history using our extended config
      # in security/gitleaks/.gitleaks.toml.
      # Fails on ANY finding (exit code 1).
      - name: Run Gitleaks secret scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source="/repo" \
            --config="/repo/security/gitleaks/.gitleaks.toml" \
            --report-format=sarif \
            --report-path="/repo/gitleaks-results.sarif" \
            --redact \
            --verbose

      # ── Upload SARIF to GitHub Code Scanning ──────────────────
      - name: Upload Gitleaks SARIF to Code Scanning
        if: always()
        continue-on-error: true # Gracefully handle repositories without paid GitHub Advanced Security licenses
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      # ── Upload SARIF artifact for audit evidence ──────────────
      - name: Upload Gitleaks SARIF artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          if-no-files-found: ignore

  # ── npm audit SCA (Production Dependency Gating) ────────────
  npm-audit:
    name: npm audit (${{ matrix.service-name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service-path: src/api-gateway
            service-name: api-gateway
          - service-path: src/user-service
            service-name: user-service
          - service-path: src/product-service
            service-name: product-service
          - service-path: src/order-service
            service-name: order-service
          - service-path: src/frontend
            service-name: frontend

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service-path }}/package-lock.json

      # ── Run npm audit in production mode ──────────────────────
      # Flags:
      #   --production (or --omit=dev): Exclude development dependencies
      #   --audit-level=high: Fail on high and critical vulnerabilities only
      #   --json: Capture raw audit data for artifact evidence
      - name: Run npm audit (Production Gating)
        working-directory: ${{ matrix.service-path }}
        run: |
          npm audit --production --audit-level=high --json > npm-audit-report.json || AUDIT_EXIT=$?
          npm audit --production --audit-level=high || true
          if [ "${AUDIT_EXIT:-0}" -ne 0 ]; then
            echo "::error::High or critical production vulnerabilities detected in ${{ matrix.service-name }}!"
            exit $AUDIT_EXIT
          fi

      # ── Upload npm audit JSON report artifact ─────────────────
      - name: Upload npm audit JSON artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: npm-audit-${{ matrix.service-name }}
          path: ${{ matrix.service-path }}/npm-audit-report.json
          if-no-files-found: ignore

  # ── OSV-Scanner (Advisory Multi-Ecosystem SCA) ───────────────
  osv-scanner:
    name: OSV-Scanner (Advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Run OSV-Scanner in advisory mode across all lockfiles ─
      # Scans all lockfiles recursively against the OSV global database.
      # Runs in advisory mode (reports and outputs table/json, non-blocking).
      - name: Run OSV-Scanner (Advisory Mode)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            ghcr.io/google/osv-scanner:latest \
            scan source \
            -r /src \
            --format json \
            --output-file /src/osv-report.json || true
          
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            ghcr.io/google/osv-scanner:latest \
            scan source \
            -r /src \
            --format table || true

      # ── Upload OSV-Scanner JSON report artifact ───────────────
      - name: Upload OSV-Scanner JSON artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: osv-scanner-report
          path: osv-report.json
          if-no-files-found: ignore


