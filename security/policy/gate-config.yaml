# ──────────────────────────────────────────────────────────────
# security/policy/gate-config.yaml — Security Gate & SCA Policy
# Purpose: Configuration file for dependency auditing, container
#          image vulnerability thresholds, and CI security gates.
#
# Consumed by:
#   - Phase 8: Software Composition Analysis (npm audit & OSV-Scanner)
#   - Phase 9: Security Gate Engine (scripts/security-gate.js)
#   - Phase 10: Trivy Image Scanning Security Gate
# ──────────────────────────────────────────────────────────────

version: "1.0.0"

# ── Software Composition Analysis (SCA) Thresholds ──────────
sca:
  # Gating applies strictly to production dependencies (--omit=dev).
  # DevDependencies are scanned and reported for supply chain monitoring,
  # but do not block production builds.
  production_only: true
  audit_level: "high"         # Block on HIGH and CRITICAL vulnerabilities
  fail_on_vulnerabilities: true

  # Severity thresholds for npm audit gating
  thresholds:
    critical: 0               # Zero critical vulnerabilities permitted in production
    high: 0                   # Zero high vulnerabilities permitted in production
    moderate: 10              # Moderate findings reported and tracked; non-blocking
    low: 50                   # Low findings reported and tracked; non-blocking

  # OSV-Scanner configuration
  osv_scanner:
    mode: "advisory"          # Advisory mode: reports all lockfile findings without blocking
    fail_on_vulnerability: false

# ── Container & Trivy Gate Policy (Used by Phase 9/10 Security Gate) ───
container_gate:
  # Filter unfixed vulnerabilities (vulnerabilities with no upstream patch available)
  # Rationale: The team cannot remediate vulnerabilities that have no fix. Gating on them
  # creates alert fatigue. Thus, ignore_unfixed is true.
  ignore_unfixed: true

  # Allowed vulnerability thresholds for passing the security gate
  # Rationale: For fixable vulnerabilities, the threshold is set exactly to the current
  # maximum count across our images (frontend has 2 CRITICAL, 36 HIGH, 57 MEDIUM, 40 LOW).
  # This enforces a "watermark" or "ratchet" policy: do not make it worse.
  thresholds:
    CRITICAL: 2
    HIGH: 36
    MEDIUM: 57
    LOW: 40

  # Enforcement behavior
  fail_on_threshold_breach: true
  fail_on_expired_exceptions: true
